[project]
name = "ai-meeting-intelligence-audit-assistant"
version = "1.0.0"
description = "Broker-first AI Meeting Intelligence & Audit Assistant: transcription, speaker diarization, meeting audit, structured reports."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "psycopg[binary,pool]>=3.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]

[tool.setuptools.packages.find]
include = ["app*"]
